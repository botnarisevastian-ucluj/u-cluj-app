<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>U Cluj — Platformă de Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --bg:#F1F6F3;
    --surface:#FFFFFF;
    --primary:#123B27;
    --primary-light:#1E5C3B;
    --accent:#C99A3E;
    --accent-soft:#F3E4C4;
    --ink:#152A1E;
    --muted:#647069;
    --danger:#B23A34;
    --danger-soft:#F6DEDC;
    --success:#2F7D5A;
    --success-soft:#DCEEE3;
    --warn:#8C6A22;
    --warn-soft:#F3E4C4;
    --border:#DEE7E1;
    --sb-bg:#0B2317;
    --sb-digit:#F4C95D;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{ margin:0; font-family:'Inter',sans-serif; background:var(--bg); color:var(--ink); }
  .app-shell{ display:flex; min-height:100vh; }

  /* ---------- LOGIN ---------- */
  .login-screen{ min-height:100vh; display:flex; align-items:center; justify-content:center; background:linear-gradient(160deg, var(--primary) 0%, #0B2317 100%); padding:20px; }
  .login-card{ background:var(--surface); border-radius:14px; padding:32px; width:100%; max-width:480px; box-shadow:0 20px 60px rgba(0,0,0,0.25); }
  .login-crest{ width:52px;height:52px;border-radius:50%;background:var(--accent); display:flex;align-items:center;justify-content:center; font-family:'Space Grotesk',sans-serif;font-weight:700;color:var(--primary);font-size:19px; margin:0 auto 14px; }
  .login-card h1{ font-family:'Space Grotesk',sans-serif; font-size:19px; text-align:center; margin:0 0 4px; }
  .login-card p.sub{ text-align:center; font-size:12.5px; color:var(--muted); margin:0 0 22px; }
  .account-list{ display:flex; flex-direction:column; gap:8px; max-height:56vh; overflow-y:auto; padding-right:4px; }
  .account-btn{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 14px; border:1px solid var(--border); border-radius:10px; background:#fff; cursor:pointer; text-align:left; transition:border-color .15s ease, background .15s ease; }
  .account-btn:hover{ border-color:var(--accent); background:var(--bg); }
  .account-btn .an{ font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:13.5px; }
  .account-btn .ar{ font-size:11.5px; color:var(--muted); margin-top:2px; }
  .access-pill{ font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:0.04em; padding:3px 8px; border-radius:99px; flex-shrink:0; }
  .access-pill.total{ background:var(--success-soft); color:var(--success); }
  .access-pill.partial{ background:var(--warn-soft); color:var(--warn); }
  .login-note{ font-size:11px; color:var(--muted); text-align:center; margin-top:18px; line-height:1.5; }
  .login-form{ display:flex; flex-direction:column; gap:14px; }
  .login-label{ display:flex; flex-direction:column; gap:6px; font-size:12.5px; font-weight:600; color:var(--muted); }
  .login-error{ background:var(--danger-soft, #FCEAEA); color:var(--danger); font-size:12px; padding:9px 12px; border-radius:8px; }

  /* ---------- SIDEBAR ---------- */
  .sidebar{ width:230px; flex-shrink:0; background:var(--primary); color:#fff; display:flex; flex-direction:column; padding:22px 16px; }
  .crest{ display:flex; align-items:center; gap:10px; margin-bottom:24px; padding:0 4px; }
  .crest-badge{ width:38px;height:38px; border-radius:50%; background:var(--accent); display:flex;align-items:center;justify-content:center; font-family:'Space Grotesk',sans-serif; font-weight:700; color:var(--primary); font-size:15px; flex-shrink:0; }
  .crest-name{ font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:14.5px; line-height:1.25; }
  .crest-name span{ display:block; font-family:'Inter',sans-serif; font-weight:400; font-size:11px; color:#B9CFC1; margin-top:2px; }
  .account-chip{ display:flex; flex-direction:column; gap:2px; background:rgba(255,255,255,0.06); border-radius:9px; padding:10px 12px; margin-bottom:16px; }
  .account-chip .nm{ font-size:12.5px; font-weight:600; }
  .account-chip .rl{ font-size:10.5px; color:#9FC2AC; }
  .account-chip button{ margin-top:8px; background:none; border:1px solid rgba(255,255,255,0.2); color:#CFE0D6; border-radius:6px; font-size:11px; padding:5px 8px; cursor:pointer; font-family:'Inter',sans-serif; }
  .account-chip button:hover{ background:rgba(255,255,255,0.1); }
  nav.navlist{ display:flex; flex-direction:column; gap:3px; flex:1; }
  .navbtn{ display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:8px; background:transparent; border:none; color:#CFE0D6; font-family:'Inter',sans-serif; font-size:13.5px; font-weight:500; text-align:left; cursor:pointer; transition:background .15s ease, color .15s ease; position:relative; }
  .navbtn:hover{ background:rgba(255,255,255,0.07); color:#fff; }
  .navbtn.active{ background:var(--accent); color:var(--primary); font-weight:600; }
  .navbtn .dot{ width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.6; flex-shrink:0; }
  .navbtn .badge-count{ margin-left:auto; background:var(--danger); color:#fff; font-size:10px; font-weight:700; border-radius:99px; padding:1px 6px; }
  .sidebar-footer{ font-size:10.5px; color:#8FAA9B; line-height:1.5; border-top:1px solid rgba(255,255,255,0.12); padding-top:14px; margin-top:14px; }

  /* ---------- MAIN ---------- */
  .main{ flex:1; display:flex; flex-direction:column; min-width:0; }
  .scoreboard{ background:var(--sb-bg); display:flex; flex-wrap:wrap; gap:0; padding:0 8px; }
  .sb-cell{ padding:18px 22px; min-width:150px; border-right:1px solid rgba(255,255,255,0.06); }
  .sb-label{ font-family:'Inter',sans-serif; font-size:10.5px; text-transform:uppercase; letter-spacing:0.08em; color:#7FA98C; margin-bottom:6px; }
  .sb-value{ font-family:'JetBrains Mono',monospace; font-weight:700; font-size:24px; color:var(--sb-digit); letter-spacing:0.02em; }
  .sb-value.neg{ color:#E08A85; }
  .sb-sub{ font-family:'JetBrains Mono',monospace; font-size:11px; color:#5C8A70; margin-top:3px; }
  .content{ padding:26px 32px 60px; flex:1; }
  .page-title{ font-family:'Space Grotesk',sans-serif; font-size:22px; font-weight:600; margin:0 0 4px; }
  .page-sub{ font-size:13px; color:var(--muted); margin:0 0 22px; }
  .grid-2{ display:grid; grid-template-columns:1.3fr 1fr; gap:20px; }
  .grid-3{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
  .grid-summary{ display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; margin-bottom:20px; }
  @media(max-width:900px){ .grid-2,.grid-3{grid-template-columns:1fr;} .app-shell{flex-direction:column;} .sidebar{width:100%;} }

  .card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:18px 20px; }
  .card h3{ font-family:'Space Grotesk',sans-serif; font-size:14.5px; font-weight:600; margin:0 0 14px; display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  .kpi-mini{ display:flex; flex-direction:column; gap:4px; }
  .kpi-mini .n{ font-family:'JetBrains Mono',monospace; font-size:20px; font-weight:700; }
  .kpi-mini .l{ font-size:11.5px; color:var(--muted); }

  table{ width:100%; border-collapse:collapse; font-size:13px; }
  th{ text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:0.05em; color:var(--muted); font-weight:600; padding:8px 10px; border-bottom:1px solid var(--border); }
  td{ padding:10px 10px; border-bottom:1px solid var(--border); vertical-align:middle; }
  tr:last-child td{ border-bottom:none; }
  tr.subtotal-row td{ font-weight:700; background:var(--bg); border-top:1px solid var(--border); }
  .num{ font-family:'JetBrains Mono',monospace; text-align:right; }
  .tag{ display:inline-block; padding:3px 9px; border-radius:99px; font-size:11px; font-weight:600; }
  .tag.venit{ background:var(--success-soft); color:var(--success); }
  .tag.cheltuiala{ background:var(--danger-soft); color:var(--danger); }
  .tag.platit{ background:var(--success-soft); color:var(--success); }
  .tag.neplatit{ background:var(--danger-soft); color:var(--danger); }
  .tag.aprobat{ background:var(--success-soft); color:var(--success); }
  .tag.respins{ background:var(--danger-soft); color:var(--danger); }
  .tag.in_asteptare{ background:var(--warn-soft); color:var(--warn); }
  .tag.restant{ background:var(--danger-soft); color:var(--danger); }
  .tag.scadent{ background:var(--warn-soft); color:var(--warn); }
  .tag.contingent{ background:var(--bg); color:var(--muted); border:1px solid var(--border); }

  .btn{ font-family:'Inter',sans-serif; font-size:12.5px; font-weight:600; padding:8px 14px; border-radius:7px; border:1px solid transparent; cursor:pointer; transition:opacity .15s ease; }
  .btn:hover{ opacity:0.85; }
  .btn-primary{ background:var(--primary); color:#fff; }
  .btn-accent{ background:var(--accent); color:var(--primary); }
  .btn-success{ background:var(--success); color:#fff; }
  .btn-ghost{ background:transparent; color:var(--primary); border-color:var(--border); }
  .btn-danger-ghost{ background:transparent; color:var(--danger); border-color:var(--border); }
  .btn-sm{ padding:5px 10px; font-size:11.5px; }
  .btn[disabled]{ opacity:0.4; cursor:not-allowed; }

  .toolbar{ display:flex; gap:10px; align-items:center; margin-bottom:16px; flex-wrap:wrap; justify-content:space-between; }
  .toolbar-left{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .toolbar select, .toolbar input[type="month"]{ width:auto; }

  input, select, textarea{ font-family:'Inter',sans-serif; font-size:13px; padding:8px 10px; border-radius:7px; border:1px solid var(--border); background:#fff; color:var(--ink); width:100%; }
  input:focus, select:focus, textarea:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  label{ font-size:11.5px; color:var(--muted); font-weight:600; display:block; margin-bottom:4px; }
  .field{ margin-bottom:12px; }
  .field-row{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .locked-field{ padding:8px 10px; border-radius:7px; background:var(--bg); border:1px dashed var(--border); font-size:13px; color:var(--muted); }

  .modal-backdrop{ position:fixed; inset:0; background:rgba(10,25,17,0.45); display:flex; align-items:center; justify-content:center; z-index:50; padding:20px; }
  .modal{ background:#fff; border-radius:12px; padding:24px; width:100%; max-width:460px; max-height:88vh; overflow-y:auto; }
  .modal h2{ font-family:'Space Grotesk',sans-serif; font-size:17px; margin:0 0 16px; }
  .modal-actions{ display:flex; gap:10px; justify-content:flex-end; margin-top:18px; }

  .empty{ text-align:center; padding:40px 20px; color:var(--muted); font-size:13px; }
  .badge-sport{ background:var(--bg); border:1px solid var(--border); padding:2px 8px; border-radius:99px; font-size:11px; color:var(--primary-light); font-weight:600; }
  .row-actions{ display:flex; gap:6px; flex-wrap:wrap; }
  .note{ font-size:11.5px; color:var(--muted); background:var(--bg); border:1px dashed var(--border); border-radius:8px; padding:10px 12px; margin-top:14px; line-height:1.5;}
  .chart-wrap{ position:relative; height:260px; }
  .muted-txt{ color:var(--muted); font-size:12px; }
  ::-webkit-scrollbar{ width:8px; height:8px; }
  ::-webkit-scrollbar-thumb{ background:var(--border); border-radius:4px; }

  /* ---------- SUB-TABS ---------- */
  .subtabs{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:20px; border-bottom:1px solid var(--border); padding-bottom:14px; }
  .subtab-btn{ font-family:'Inter',sans-serif; font-size:12.5px; font-weight:600; padding:7px 13px; border-radius:99px; border:1px solid var(--border); background:#fff; color:var(--muted); cursor:pointer; }
  .subtab-btn:hover{ border-color:var(--accent); color:var(--ink); }
  .subtab-btn.active{ background:var(--primary); color:#fff; border-color:var(--primary); }

  /* ---------- ASK U (persistent top bar) + notificări ---------- */
  .topbar-row{ display:flex; align-items:flex-start; gap:10px; margin:16px 24px 0; }
  .ask-u-bar{ display:flex; align-items:center; gap:10px; background:linear-gradient(90deg,#ede9fe,#f5f3ff); border:1px solid var(--accent); border-radius:12px; padding:9px 14px; margin:0; flex:1; min-width:0; }
  .ask-u-icon{ font-size:16px; }
  .ask-u-bar input{ flex:1; border:none; background:transparent; font-family:'Inter',sans-serif; font-size:13.5px; outline:none; }
  .notif-wrap{ position:relative; flex-shrink:0; }
  .notif-bell{ position:relative; border:1px solid var(--border); background:#fff; border-radius:10px; padding:9px 12px; font-size:15px; cursor:pointer; height:100%; }
  .notif-badge{ position:absolute; top:-6px; right:-6px; background:var(--danger); color:#fff; font-size:10px; font-weight:700; border-radius:99px; padding:1px 5px; }
  .notif-panel{ position:absolute; right:0; top:110%; width:320px; max-height:400px; overflow-y:auto; background:#fff; border:1px solid var(--border); border-radius:10px; box-shadow:0 12px 30px rgba(0,0,0,0.15); z-index:50; padding:8px; }
  .notif-panel-head{ display:flex; align-items:center; justify-content:space-between; font-size:12.5px; font-weight:700; padding:4px 6px 8px; }
  .notif-item{ padding:8px; border-radius:8px; margin-bottom:4px; }
  .notif-item.unread{ background:var(--bg); }
  .notif-item .nt{ font-size:12.5px; font-weight:700; }
  .notif-item .nb{ font-size:11.5px; color:var(--muted); margin-top:2px; }
  .notif-item .nm{ font-size:10.5px; color:var(--muted); margin-top:4px; }
  .notif-item .nm a{ color:var(--accent); font-weight:600; margin-left:6px; }

  /* ---------- ALERT CARDS (Home / AI Alerts & Decisions Needed, Contracte deadline-uri) ---------- */
  .alert-card{ border:1px solid var(--border); border-left:4px solid var(--muted); border-radius:8px; padding:10px 12px; margin-bottom:10px; background:#fff; }
  .alert-card.red{ border-left-color:var(--danger); background:#fef2f2; }
  .alert-card.orange{ border-left-color:var(--warn); background:#fffbeb; }
  .alert-card .at{ font-weight:700; font-size:13px; margin-bottom:4px; }
  .alert-card .as{ font-size:12px; color:var(--muted); line-height:1.5; }

  /* ---------- STATUS DOTS (compliance) ---------- */
  .status-dot{ display:inline-block; width:9px;height:9px;border-radius:50%; margin-right:6px; flex-shrink:0; }
  .status-dot.complete{ background:var(--success); }
  .status-dot.attention{ background:var(--warn); }
  .status-dot.overdue{ background:var(--danger); }
  .status-row{ display:flex; align-items:center; gap:4px; }

  /* ---------- KANBAN (Transfers & Scouting) ---------- */
  .kanban{ display:flex; gap:12px; overflow-x:auto; padding-bottom:8px; }
  .kanban-col{ background:var(--bg); border-radius:10px; padding:12px; width:220px; flex-shrink:0; }
  .kanban-col h4{ font-family:'Space Grotesk',sans-serif; font-size:12.5px; margin:0 0 10px; display:flex; justify-content:space-between; align-items:center; color:var(--primary-light); }
  .kanban-col h4 .cnt{ background:var(--surface); border-radius:99px; padding:1px 7px; font-size:11px; color:var(--muted); }
  .kanban-card{ background:var(--surface); border:1px solid var(--border); border-radius:9px; padding:10px 11px; margin-bottom:9px; font-size:12.5px; cursor:pointer; }
  .kanban-card:hover{ border-color:var(--accent); }
  .kanban-card .kt{ font-weight:600; margin-bottom:3px; }
  .kanban-card .ks{ font-size:11px; color:var(--muted); }

  /* ---------- MATCH / TASK CHECKLIST ---------- */
  .checklist-item{ display:flex; align-items:center; gap:10px; padding:9px 4px; border-bottom:1px solid var(--border); font-size:13px; }
  .checklist-item:last-child{ border-bottom:none; }
  .checklist-item .cl-owner{ font-size:11px; color:var(--muted); margin-left:auto; }

  /* ---------- AI ASSISTANT CHAT ---------- */
  .chat-wrap{ display:flex; flex-direction:column; height:520px; }
  .chat-messages{ flex:1; overflow-y:auto; padding:6px 4px; display:flex; flex-direction:column; gap:12px; }
  .chat-bubble{ max-width:78%; padding:11px 14px; border-radius:12px; font-size:13.5px; line-height:1.5; white-space:pre-wrap; }
  .chat-bubble.user{ align-self:flex-end; background:var(--primary); color:#fff; border-bottom-right-radius:3px; }
  .chat-bubble.bot{ align-self:flex-start; background:var(--bg); color:var(--ink); border:1px solid var(--border); border-bottom-left-radius:3px; }
  .chat-suggestions{ display:flex; gap:8px; flex-wrap:wrap; margin:10px 0 14px; }
  .chat-suggestion{ font-size:11.5px; background:var(--accent-soft); color:var(--warn); border:none; border-radius:99px; padding:6px 11px; cursor:pointer; font-family:'Inter',sans-serif; }
  .chat-input-row{ display:flex; gap:8px; margin-top:10px; }
  .chat-input-row input{ flex:1; }
</style>
</head>
<body>

<div id="app"></div>

<script>
/* ============ CONFIG: ACCOUNTS & DREPTURI DE ACCES (RBAC) ============ */
const MODULE_IDS = ["dashboard","inbox","players","transfers","contracts","finance","matchops","compliance","commercial","medical","documents","academy","staff","assistant","audit"];

/* Fiecare rol: pagini permise (module), sub-taburi Comercial permise (dacă nu e "toate"), și capabilități (aprobare cheltuieli, acces la cifre financiare, acces la detalii clinice, vedere „doar ale mele"). */
const ROLE_DEFS = {
  ceo:               { label:"CEO",                name:"CEO Club",           accessLabel:"Acces total",                          tier:"total",   pages: MODULE_IDS, commercialTabs:"toate", canApprove:true,  financeAccess:true,  medicalDetail:true,  ownReferateOnly:false },
  president:         { label:"Președinte / Board",  name:"Președinte",         accessLabel:"Executive Dashboard",                  tier:"partial", pages:["dashboard","audit","assistant"], commercialTabs:"toate", canApprove:false, financeAccess:true,  medicalDetail:false, ownReferateOnly:false },
  sporting_director: { label:"Director Sportiv",     name:"Director Sportiv",   accessLabel:"Acces parțial — Squad & Transferuri",  tier:"partial", pages:["dashboard","inbox","players","transfers","assistant"], commercialTabs:"toate", canApprove:false, financeAccess:false, medicalDetail:false, ownReferateOnly:false },
  cfo:               { label:"CFO",                  name:"CFO",                accessLabel:"Acces parțial — Finanțe & Contracte",  tier:"partial", pages:["dashboard","inbox","finance","contracts","assistant"], commercialTabs:"toate", canApprove:true,  financeAccess:true,  medicalDetail:false, ownReferateOnly:false },
  legal:             { label:"Legal",                name:"Legal",              accessLabel:"Acces parțial — Contracte & Compliance", tier:"partial", pages:["dashboard","inbox","contracts","compliance","documents","audit","assistant"], commercialTabs:"toate", canApprove:false, financeAccess:false, medicalDetail:false, ownReferateOnly:false },
  team_manager:      { label:"Team Manager",         name:"Team Manager",       accessLabel:"Acces parțial — Meci & Jucători",      tier:"partial", pages:["dashboard","matchops","players","assistant"], commercialTabs:"toate", canApprove:false, financeAccess:false, medicalDetail:false, ownReferateOnly:true },
  medical:           { label:"Medical",              name:"Medical",            accessLabel:"Acces parțial — Medical",              tier:"partial", pages:["medical","assistant"], commercialTabs:"toate", canApprove:false, financeAccess:false, medicalDetail:true,  ownReferateOnly:false },
  commercial:        { label:"Commercial",           name:"Commercial",         accessLabel:"Acces parțial — Sponsori & Hospitality", tier:"partial", pages:["commercial","assistant"], commercialTabs:["sponsorizari","inventar"], canApprove:false, financeAccess:false, medicalDetail:false, ownReferateOnly:false },
  media:             { label:"Media",                name:"Media",              accessLabel:"Acces parțial — Meci & Conținut",      tier:"partial", pages:["matchops","assistant"], commercialTabs:"toate", canApprove:false, financeAccess:false, medicalDetail:false, ownReferateOnly:false },
  ticketing:         { label:"Ticketing",             name:"Ticketing",          accessLabel:"Acces parțial — Ticketing",            tier:"partial", pages:["commercial","assistant"], commercialTabs:["ticketing"], canApprove:false, financeAccess:false, medicalDetail:false, ownReferateOnly:false },
  academy:           { label:"Academy",               name:"Academy",            accessLabel:"Acces parțial — Academie",             tier:"partial", pages:["academy","assistant"], commercialTabs:"toate", canApprove:false, financeAccess:false, medicalDetail:false, ownReferateOnly:false },
};
const ACCOUNTS = Object.entries(ROLE_DEFS).map(([role,def])=>({ id:role, name:def.name, role, accessLabel:def.accessLabel, tier:def.tier }));
const ROLE_PAGES = Object.fromEntries(Object.entries(ROLE_DEFS).map(([role,def])=>[role, def.pages]));
const ROLE_LABELS = Object.fromEntries(Object.entries(ROLE_DEFS).map(([role,def])=>[role, def.label]));

function currentRoleDef(){ return STATE.currentAccount ? ROLE_DEFS[STATE.currentAccount.role] : null; }
function hasPage(page){ if(!STATE.currentAccount) return false; return ROLE_PAGES[STATE.currentAccount.role].includes(page); }
function isAdmin(){ const r = currentRoleDef(); return !!r && r.canApprove; }
function isAntrenor(){ const r = currentRoleDef(); return !!r && r.ownReferateOnly; }
function canSeeFinance(){ const r = currentRoleDef(); return !!r && r.financeAccess; }
function canSeeMedicalDetail(){ const r = currentRoleDef(); return !!r && r.medicalDetail; }
function landingPage(){ const pages = STATE.currentAccount ? ROLE_PAGES[STATE.currentAccount.role] : []; return pages.includes('dashboard') ? 'dashboard' : (pages[0] || 'assistant'); }

function findPlayerInText(text){
  const nt = normName(text);
  const candidates = STATE.angajati.filter(a=>['Jucători seniori','Jucători juniori'].includes(a.categorie));
  let best = candidates.find(a=> nt.includes(normName(a.nume)));
  if(!best){
    best = candidates.find(a=>{
      const parts = normName(a.nume).split(' ').filter(p=>p.length>3);
      return parts.some(p=>nt.includes(p));
    });
  }
  return best || null;
}
function extractAmountEUR(text){
  const m = text.match(/(?:€|EUR)\s?([\d]{1,3}(?:[.,]\d{3})*(?:[.,]\d+)?)|([\d]{1,3}(?:[.,]\d{3})*(?:[.,]\d+)?)\s?(?:€|EUR)/i);
  if(!m) return null;
  const raw = (m[1]||m[2]||'').replace(/\./g,'').replace(/,/g,'');
  const n = parseFloat(raw);
  return isNaN(n) ? null : n;
}
function extractDate(text){
  let m = text.match(/(\d{4})-(\d{2})-(\d{2})/);
  if(m) return `${m[1]}-${m[2]}-${m[3]}`;
  m = text.match(/(\d{1,2})[.\/](\d{1,2})[.\/](\d{4})/);
  if(m) return `${m[3]}-${String(m[2]).padStart(2,'0')}-${String(m[1]).padStart(2,'0')}`;
  return null;
}
function extractAllDates(text){
  const out = [];
  const re = /(\d{4}-\d{2}-\d{2})|(\d{1,2}[.\/]\d{1,2}[.\/]\d{4})/g;
  let m;
  while((m = re.exec(text))){
    const d = m[0];
    let mm = d.match(/(\d{4})-(\d{2})-(\d{2})/);
    if(mm){ out.push(`${mm[1]}-${mm[2]}-${mm[3]}`); continue; }
    mm = d.match(/(\d{1,2})[.\/](\d{1,2})[.\/](\d{4})/);
    if(mm) out.push(`${mm[3]}-${String(mm[2]).padStart(2,'0')}-${String(mm[1]).padStart(2,'0')}`);
  }
  return out.sort();
}
function processEmailTransfer(text){
  const player = findPlayerInText(text);
  const suma = extractAmountEUR(text);
  const clubMatch = text.match(/de la\s+([A-ZȘȚĂÂÎ][\wĂÂÎȘȚăâîșț.\- ]{2,40})/);
  const club = clubMatch ? clubMatch[1].trim() : null;
  if(!player){
    return { ok:false, message:"Nu am putut identifica un jucător din lotul de seniori/juniori în text — verifică ortografia numelui, sau introdu ținta manual în Transfer Center." };
  }

  if(!deal){
    deal = { id:uid(), nume:player.nume, pozitie:player.functie||'—', club: club||'(neidentificat din text)', varsta:null, nationalitate:'—', stage:'CONTACT', agent:'', feeCerut:0, feeOferit: suma||0, salariu:0, moneda:'EUR', signingFee:0, comisionAgent:0, sellOnPct:0, aniContract:3, documente:true, alternativaPentru:'', note:'Creat automat din email procesat (Inbox AI).', cronologie:[], dataUpdate:todayISO() };
    STATE.transferDeals.push(deal);

  notifyRole('sporting_director', 'Ofertă transfer nouă', `${player.nume} — ${suma?money(suma,'EUR'):'sumă neprecizată'}${club?' de la '+club:''}.`, 'transfers');
  logAudit('Email procesat automat (Inbox)', player.nume, `Sumă: ${suma?money(suma,'EUR'):'neidentificată'}, club: ${club||'neidentificat'}`);
  return { ok:true, message:`Jucător identificat: ${player.nume}. Sumă: ${suma?money(suma,'EUR'):'neidentificată — completează manual'}. Club: ${club||'neidentificat din text'}. Card creat/actualizat în Transfer Center (etapă ${deal.stage}), emailul e marcat ca document atașat, Director Sportiv notificat.` };
}
function processContractPdf(text){
  const player = findPlayerInText(text);
  const salariu = extractAmountEUR(text);
  const allDates = extractAllDates(text);
  const contractEnd = allDates.length ? allDates[allDates.length-1] : null;
  const optionMatch = text.match(/op[țt]iune[^€\d]{0,30}(?:€|EUR)?\s?([\d]{1,3}(?:[.,]\d{3})*(?:[.,]\d+)?)/i);
  const optionAmount = optionMatch ? parseFloat(optionMatch[1].replace(/\./g,'').replace(/,/g,'')) : null;
  if(!player){
    return { ok:false, message:"Nu am putut identifica un jucător din lot în text — introdu manual în Squad → Player 360°." };
  }
  const fields = {};
  if(contractEnd) fields.contractEnd = contractEnd;
  if(optionAmount) fields.optiuniPrelungire = `Opțiune de cumpărare extrasă automat: ${money(optionAmount,'EUR')}${allDates[0]?', termen '+fmtDate(allDates[0]):''}.`;
  if(Object.keys(fields).length) Object.assign(player, fields);
  const complianceEntry = { id:uid(), categorie:'Contract (extras automat)', titlu:`Obligație contractuală — ${player.nume}${optionAmount?' (opțiune '+money(optionAmount,'EUR')+')':''}`, deadline: allDates[0]||contractEnd||null, responsabil:'CFO', status:'attention', documente:[], observatii:'Creat automat din PDF procesat prin Inbox.' };
  STATE.complianceItems.push(complianceEntry);
  notifyRole('cfo', 'Contract nou procesat', `${player.nume} — deadline ${complianceEntry.deadline?fmtDate(complianceEntry.deadline):'neidentificat'}.`, 'finance');
  logAudit('Contract PDF procesat automat (Inbox)', player.nume, `Salariu detectat: ${salariu?money(salariu,'EUR'):'—'}, contract end: ${contractEnd||'—'}, opțiune: ${optionAmount?money(optionAmount,'EUR'):'—'}`);
  return { ok:true, message:`Jucător: ${player.nume}. ${contractEnd?'Dată expirare contract detectată: '+fmtDate(contractEnd)+'. ':''}${optionAmount?'Opțiune de cumpărare detectată: '+money(optionAmount,'EUR')+'. ':''}${salariu?'Sumă detectată în text: '+money(salariu,'EUR')+' (verifică manual dacă e salariul sau altă sumă). ':''}Obligație financiară creată (Compliance), CFO notificat.` };
}
const DEPT_ROLE_MAP = { 'Legal':'legal', 'Financiar':'cfo', 'Medical':'medical', 'Academie':'academy', 'Sportiv':'sporting_director', 'Administrativ':'ceo' };
function guessDepartmentFromText(text){
  const t = text.toLowerCase();
  if(/medical|doping|s[ăa]n[ăa]t/.test(t)) return 'Medical';
  if(/stadion|infrastructur|securitate/.test(t)) return 'Administrativ';
  if(/licen[țt]|disciplin/.test(t)) return 'Legal';
  if(/financ|sustenabil|buget/.test(t)) return 'Financiar';
  if(/academi|junior/.test(t)) return 'Academie';
  if(/lot|[îi]nregistrare|transfer/.test(t)) return 'Sportiv';
  return 'Administrativ';
}
function processUefaDocument(text){
  const deadline = extractDate(text);
  const dept = guessDepartmentFromText(text);
  const roleId = DEPT_ROLE_MAP[dept] || 'ceo';
  const firstLine = (text.split(/\n|\.(?!\d)/).map(s=>s.trim()).find(s=>s.length>8)) || 'Document UEFA/FRF/LPF';
  const task = { id:uid(), titlu: firstLine.slice(0,140), departament: dept, responsabil: ROLE_DEFS[roleId].name, deadline: deadline || todayISO(), status:'todo', prioritate:'mare' };
  STATE.tasks.push(task);
  notifyRole(roleId, 'Document UEFA/FRF/LPF nou', `${task.titlu}${deadline?' — termen '+fmtDate(deadline):''}.`, 'staff');
  logAudit('Document UEFA/FRF/LPF procesat automat (Inbox)', task.titlu, `Departament: ${dept}, termen: ${deadline?fmtDate(deadline):'neidentificat'}`);
  return { ok:true, message:`Task creat: „${task.titlu}” — departament ${dept} (${ROLE_DEFS[roleId].name} notificat)${deadline?', termen '+fmtDate(deadline):' — niciun termen identificat automat, completează manual'}.` };
}
function processIntake(){
  const tip = STATE.intakeDraft.tip;
  const text = STATE.intakeDraft.text || '';
  if(!text.trim()){ STATE.intakeResult = { ok:false, message:'Lipește textul emailului/contractului/documentului mai întâi.' }; render(); return; }
  let result;
  if(tip==='email_transfer') result = processEmailTransfer(text);
  else if(tip==='contract_pdf') result = processContractPdf(text);
  else result = processUefaDocument(text);
  STATE.intakeResult = result;
  STATE.inboxQueue.unshift({ id:uid(), ts:new Date().toISOString(), tip, preview: text.slice(0,140), ok:result.ok, message:result.message });
  if(STATE.inboxQueue.length>100) STATE.inboxQueue.length=100;
  scheduleSave();
  render();
}

      if(data && data.session && data.session.user){ await fetchProfileAndSetAccount(data.session.user); }
    }
  } catch(e){ console.error("Nu s-a putut verifica sesiunea:", e); }
  STATE.accountChecked = true;
}
async function loginWithPassword(email, password){
  STATE.authError = null;
  STATE.authLoading = true;
  render();
  try{
    if(!sb) throw new Error("Supabase nu este disponibil.");
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if(error || !data.user){
      STATE.authError = "Email sau parolă incorecte.";
    } else {
      await fetchProfileAndSetAccount(data.user);
      if(STATE.currentAccount){
        if(!STATE.clubLoaded) await loadState();
        logAudit('Autentificare', STATE.currentAccount.name, `Rol: ${ROLE_LABELS[STATE.currentAccount.role]}`);
        scheduleSave();
      }
    }
  } catch(e){
    console.error(e);
    STATE.authError = "Eroare de conectare. Încearcă din nou.";
  }
  STATE.authLoading = false;
  render();
}
async function logout(){
  if(STATE.currentAccount) logAudit('Deconectare', STATE.currentAccount.name, '');
  scheduleSave();
  try{ if(sb) await sb.auth.signOut(); } catch(e){ console.error(e); }
  STATE.currentAccount = null;
  render();
}

function computeInstallmentStatus(row){
  if(row.variabil) return 'contingent';
  const achitat = Number(row.sumaAchitata||0);
  const suma = Number(row.suma||0);
  if(suma>0 && achitat >= suma) return 'platit';
  if(!row.dataScadenta) return 'contingent';
  return row.dataScadenta < todayISO() ? 'restant' : 'scadent';
}

  return {platit:'Plătit', restant:'Restant', scadent:'Scadent viitor', contingent:'Contingent / variabil'}[key] || key;
}

function simulareTransfer(jucatorPlecatId, transferFee, jucatorNouSalariu, jucatorNouMoneda){
  const plecat = STATE.angajati.find(a=>a.id===jucatorPlecatId);
  const costLunarPlecat = plecat ? angajatTotal(plecat) : 0;
  const costAnualEconomisit = costLunarPlecat * 12;
  const costAnualNou = Number(jucatorNouSalariu||0) * 12;
  const impactNetAnual = Number(transferFee||0) + costAnualEconomisit - costAnualNou;
  return { plecat, costLunarPlecat, costAnualEconomisit, costAnualNou, impactNetAnual, moneda: jucatorNouMoneda||'EUR' };
}

function calculateDeal(){

  for(let y=1; y<=ani; y++){

  }
  const costTotal = cashflow.reduce((s,v)=>s+v,0);
  const costAnualRecurent = salariu*12;

  const ratioDupa = squadCostRatio(costAnualRecurent*CURS_REFERINTA_BNR);
  STATE.dealCalcResult = { fee, salariu, signing, comision, ani, cashflow, costTotal, costAnualRecurent, ratioInainte, ratioDupa };
  scheduleSave();
  render();
}

/* --- Finance: Scenario Builder — recalculează cash-flow, profit, transfer balance, sell-on payable, squad cost pentru scenarii de tip vânzare/achiziție jucător, sau impact sportiv (reutilizează SCENARII_FINANCIARE pentru Play-Off/Play-Out/Europa). --- */
const SCENARIO_TYPES = [
  ["vanzare_jucator","Vânzare jucător"],
  ["achizitie_jucator","Achiziție jucător"],
  ["sponsor_nou","Sponsor nou"],
  ["loc4","Loc 4 — calificare europeană"],
  ["playoff","Play-Off"],
  ["playout","Play-Out / risc retrogradare"],
];
function calculateScenario(){
  const sb = STATE.scenarioBuilder;
  const tip = sb.tip;
  if(tip==='vanzare_jucator' || tip==='achizitie_jucator'){
    const p = STATE.angajati.find(a=>a.id===sb.jucatorId);
    const suma = Number(sb.suma||0);
    const salariuAnualRon = p ? angajatTotal(p)*12*((p.moneda||'LEI').toUpperCase()==='EUR'?CURS_REFERINTA_BNR:1) : 0;
    const sumaRon = suma*CURS_REFERINTA_BNR;
    if(tip==='vanzare_jucator'){
      const pf = p ? playerAgentItems(p.nume) : {sellOn:[]};
      const sellOnPayable = pf.sellOn.length ? pf.sellOn.map(v=>v.observatii).join('; ') : null;
      const solidarityEstimat = Math.round(suma*0.05);
      STATE.scenarioBuilderResult = {
        tip, jucator: p ? p.nume : '(neselectat)', suma, data: sb.data,
        cashflowImpact: sumaRon,
        profitEstimat: sumaRon,
        transferBalanceImpact: sumaRon,
        sellOnPayable,
        solidarityEstimat,
        squadCostInainte: squadCostSeniorRon(),
        squadCostDupa: squadCostSeniorRon() - salariuAnualRon,
        nota: "Book value / profit on disposal exact necesită costul inițial de achiziție al jucătorului (neurmărit încă per jucător) — profitul afișat e echivalentul brut al sumei de transfer. Solidarity contribution e o estimare generică FIFA de 5% — valoarea reală depinde de cluburile de formare și vârsta jucătorului (12-23 ani) și necesită calcul oficial."
      };
    } else {
      STATE.scenarioBuilderResult = {
        tip, jucator: p ? p.nume : '(jucător nou)', suma, data: sb.data,
        cashflowImpact: -sumaRon,
        transferBalanceImpact: -sumaRon,
        squadCostInainte: squadCostSeniorRon(),
        squadCostDupa: squadCostSeniorRon() + salariuAnualRon,
        nota: "Impactul asupra squad cost presupune că jucătorul selectat din listă e cel al cărui salariu se adaugă — pentru un jucător complet nou, introdu-l mai întâi în modulul Squad, apoi rulează din nou scenariul."
      };
    }
  } else if(tip==='sponsor_nou'){
    const sumaRon = Number(sb.suma||0)*CURS_REFERINTA_BNR;
    STATE.scenarioBuilderResult = { tip, suma: Number(sb.suma||0), data: sb.data, cashflowImpact: sumaRon, ratioNouDupaVenit: squadCostRatio(0)*(BUGET_VENITURI_TOTAL_RON/(BUGET_VENITURI_TOTAL_RON+sumaRon)), nota: "Impactul asupra squad cost ratio presupune că suma se adaugă integral la venituri bugetate." };
  } else {
    const sc = SCENARII_FINANCIARE[tip];
    STATE.scenarioBuilderResult = { tip, cashflowImpact: sc.impactRon, nota: sc.nota, label: sc.label };
  }
  scheduleSave();
  render();
}

/* --- Export SAGA C: SAGA nu are API live — funcționează exclusiv prin import de fișiere XML, cu denumiri de fișier standard (F_/P_/I_/FUR_/CLI_/ART_). Generăm aici fișierele de Încasări (I_) și Plăți (P_) din tranzacțiile deja introduse. Structura XML de mai jos e reconstituită din documentația publică SAGA — verifică un import de test în instalarea reală înainte de a te baza pe ea în producție, și ajustează denumirile de tag-uri dacă versiunea ta de SAGA C diferă. --- */
function xmlEscape(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function buildSagaXML(kind){
  const cont = STATE.sagaContTrezorerie || '5121';
  const rows = STATE.transactions.filter(t=> kind==='incasari' ? t.type==='venit' : t.type==='cheltuiala');
  const rootTag = kind==='incasari' ? 'Incasari' : 'Plati';
  const partnerTag = kind==='incasari' ? 'ContClient' : 'ContFurnizor';
  let n = 0;
  const lines = rows.map(t=>{
    n++;
    return `  <Linie>
    <Data>${t.date}</Data>
    <Numar>${n}</Numar>
    <Suma>${Number(t.amount||0).toFixed(2)}</Suma>
    <Cont>${xmlEscape(cont)}</Cont>
    <${partnerTag}></${partnerTag}>
    <Explicatie>${xmlEscape((t.description||'') + ' — ' + t.category)}</Explicatie>
    <Moneda>RON</Moneda>
  </Linie>`;
  }).join('\n');
  return `<?xml version="1.0" encoding="UTF-8"?>\n<${rootTag}>\n${lines}\n</${rootTag}>`;
}
function downloadTextFile(filename, content, mime){
  const blob = new Blob([content], {type: mime||'application/xml;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}
function exportSagaFile(kind){
  const xml = buildSagaXML(kind);
  const prefix = kind==='incasari' ? 'I' : 'P';
  const filename = `${prefix}_${todayISO().replace(/-/g,'')}.xml`;
  downloadTextFile(filename, xml);
  logAudit('Descărcat export SAGA', filename, kind==='incasari' ? 'Încasări' : 'Plăți');
  scheduleSave();
}
function setSagaCont(val){ STATE.sagaContTrezorerie = val; scheduleSave(); }

/* --- Executive Brief (Modul 1 — Dashboard): sinteză generată din regulile aplicației, nu dintr-un motor AI live — vezi nota din interfață. --- */
function generateExecutiveBrief(){
  const lines = [];
  const s = sold();
  lines.push(`Sold curent cont: ${ron(s)}.`);
  const restSeniori = angajamenteSeniorRestante();
  if(restSeniori>0) lines.push(`Angajamente restante Seniori (comisioane + prime instalare, sumă fixă): ${money(restSeniori,'EUR')}.`);
  const restSponsori = totalRestSponsoriRon();
  if(restSponsori>0) lines.push(`Rest de încasat de la sponsori: ${ron(restSponsori)} — la data extragerii centralizatorului, nicio tranșă cu sumă fixă nu fusese încă încasată.`);
  const exp30 = contracteExpirandIn(30);
  if(exp30.length) lines.push(`${exp30.length} eveniment(e) contractual(e)/compliance în următoarele 30 de zile — vezi modulul Contracte & Legal: ${exp30.slice(0,3).map(r=>r.eveniment).join('; ')}${exp30.length>3?'…':''}.`);
  const overdue = STATE.complianceItems.filter(c=>c.status==='overdue');
  if(overdue.length) lines.push(`${overdue.length} obligație(i) de compliance depășită(e): ${overdue.map(o=>o.titlu).join('; ')}.`);
  const pend = referatePending();
  if(pend.length) lines.push(`${pend.length} referat(e) de cheltuială în așteptare de aprobare.`);
  const tasksMari = STATE.tasks.filter(t=>t.prioritate==='mare' && t.status!=='done');
  if(tasksMari.length) lines.push(`${tasksMari.length} task-uri de prioritate mare deschise: ${tasksMari.slice(0,3).map(t=>t.titlu).join('; ')}${tasksMari.length>3?'…':''}.`);
  const nm = nextMatch();

  return lines.join('\n\n');
}

/* --- AI Club Assistant: motor bazat pe reguli (keyword matching peste date reale), NU un model AI conversațional liber — vezi nota din interfață. --- */
function askAssistant(q){
  const t = (q||'').toLowerCase();
  if(/transfer|comision|prim[aă] de instala/.test(t) && /pl[ăa]t|decembrie|scaden/.test(t)){
    const cutoff = t.includes('decembrie') ? `${new Date().getFullYear()}-12-31` : null;
    const rows = [...STATE.comisioane.filter(c=>!c.variabil && !c.platit && c.dataScadenta), ...STATE.primeInstalare.filter(p=>!p.platit && p.dataScadenta)];
    const filtered = cutoff ? rows.filter(r=>r.dataScadenta<=cutoff) : rows;
    const total = filtered.reduce((s,r)=>s+Number(r.suma||0)-Number(r.sumaAchitata||0),0);
    return `Rest de plată pentru comisioane agenți + prime de instalare${cutoff?', cu scadență până la 31 decembrie '+new Date().getFullYear():''}: ${money(total,'EUR')}, din ${filtered.length} tranșe. Detalii complete în modulul Finanțe & Buget → Comisioane & Prime.`;
  }
  if(/contract.*expir|expir.*contract|licen[țt].*expir/.test(t)){
    const rows = contracteExpirandIn(180);
    if(!rows.length) return "Nu am identificat contracte/evenimente cu dată fixă în următoarele 6 luni, în registrul curent. Registrul din modulul Contracte & Legal nu acoperă încă toate contractele individuale — completează-l pentru un rezultat exhaustiv.";
    return `${rows.length} evenimente contractuale/compliance în următoarele 6 luni:\n` + rows.map(r=>`• ${fmtDate(r.data)} — ${r.eveniment} (${r.parte})`).join('\n');
  }
  if(/ultimele.*12.*luni|12.*luni.*contract|contract.*ultim.*an|ultim.*an.*contract/.test(t)){
    const rows = playersWithContractEndingWithin(365);
    if(!rows.length) return "Niciun jucător nu are momentan o dată de expirare a contractului introdusă în intervalul următoarelor 12 luni. Câmpul „Dată expirare contract” din Player 360° (tab Contract) e gol pentru majoritatea jucătorilor din lot — completează-l pentru fiecare jucător ca această întrebare să devină utilă.";
    return `${rows.length} jucători cu contractul expirând în următoarele 12 luni:\n` + rows.map(a=>`• ${a.nume} — expiră ${fmtDate(a.contractEnd)} (${daysUntil(a.contractEnd)} zile)`).join('\n') + '\nDetalii complete în modulul Squad → Player 360° → tab Contract.';
  }
  if(/uefa.*30|30.*zile.*uefa|transmite.*uefa|uefa.*transmit/.test(t)){
    const rows = STATE.complianceItems.filter(c=>c.deadline && daysUntil(c.deadline)!==null && daysUntil(c.deadline)>=0 && daysUntil(c.deadline)<=30 && c.status!=='complete');
    if(!rows.length) return "Nu am identificat obligații de licențiere/compliance cu termen în următoarele 30 de zile care să nu fie deja marcate „Complet”. Vezi Compliance Center pentru calendarul complet.";
    return `${rows.length} obligații de transmis/rezolvat în următoarele 30 de zile:\n` + rows.map(c=>`• ${fmtDate(c.deadline)} — ${c.titlu} (${c.categorie}, responsabil ${c.responsabil})`).join('\n');
  }
  if(/200\s*\.?000|peste.*200.*mii|cost.*anual.*mare/.test(t) && /jucăt|jucator/.test(t)){
    const rows = STATE.angajati.filter(a=>a.categorie==='Jucători seniori').map(a=>({a, costAnual: angajatTotal(a)*12*((a.moneda||'LEI').toUpperCase()==='EUR'?1:1/CURS_REFERINTA_BNR)})).filter(r=>r.costAnual>200000).sort((a,b)=>b.costAnual-a.costAnual);
    if(!rows.length) return "Niciun jucător din lotul de seniori nu depășește €200.000 cost anual, la calculul curent (salariu + taxe + chirie + bonusuri ×12, echivalent EUR).";
    return `${rows.length} jucători cu cost anual peste €200.000:\n` + rows.map(r=>`• ${r.a.nume} — ${money(Math.round(r.costAnual),'EUR')}/an`).join('\n');
  }
  if(/compar[ăa].*buget|buget.*actual.*aprobat|buget.*fa[țt][aă].*aprobat/.test(t)){
    const bugetVenituri = 58883307, bugetCheltuieli = 57104528;
    return `Buget aprobat 2026-2027: venituri ${ron(bugetVenituri)}, cheltuieli ${ron(bugetCheltuieli)}.\nRealizat (din tranzacțiile introduse): venituri ${ron(totalVenituri())}, cheltuieli ${ron(totalCheltuieli())}.\nDiferență venituri: ${ron(totalVenituri()-bugetVenituri)}. Diferență cheltuieli: ${ron(totalCheltuieli()-bugetCheltuieli)}.\nDetalii complete în Finance → Budget vs. Actual.`;
  }
  if(/obliga[țt]ii.*contractual|contract.*fa[țt][aă] de|ce.*prevede.*contract/.test(t)){
    const player = STATE.angajati.find(a=>['Jucători seniori','Jucători juniori'].includes(a.categorie) && t.includes(normName(a.nume).split(' ').pop()));
    if(!player) return "Spune-mi numele jucătorului (ex: „obligațiile contractuale față de Zamfir”) și caut în registrul de contracte, comisioane și prime de instalare.";
    const pf = playerAgentItems(player.nume);
    return `Obligații contractuale — ${player.nume}:\nSalariu: ${money(player.salariuNet,player.moneda)}/lună. Dată expirare contract: ${player.contractEnd?fmtDate(player.contractEnd):'neintrodusă'}.\nRest comisioane agent: ${pf.restComisioane>0?money(pf.restComisioane,'EUR'):'—'}. Rest primă de instalare: ${pf.restPrime>0?money(pf.restPrime,'EUR'):'—'}.\nSell-on/clauze: ${pf.sellOn.length?pf.sellOn.map(v=>v.observatii).join('; '):'niciuna identificată'}.\nDetalii complete în Squad → Player 360° → ${player.nume}.`;
  }
  if(/probleme.*meci|meci.*probleme/.test(t)){
    const nm = nextMatch();
    if(!nm) return "Nu există meciuri programate în modulul Match Center.";
    const r = matchReadiness(nm);
    const critice = nm.sarcini.filter(s=>s.status!=='done' && daysUntil(s.deadline)!==null && daysUntil(s.deadline)<0);
    if(!critice.length) return `${nm.adversar} (${fmtDate(nm.data)}) — readiness ${r.pct}%, fără sarcini critice depășite momentan. ${r.pending} sarcini încă în lucru/de făcut.`;
    return `${nm.adversar} (${fmtDate(nm.data)}) — readiness ${r.pct}%. 🔴 ${critice.length} probleme critice:\n` + critice.map(s=>`• ${s.titlu} — ${s.responsabil}, termen depășit (${fmtDate(s.deadline)})`).join('\n');
  }
  if(/meci|joi|s[aâ]mb[aă]t[aă]|duminic[aă]/.test(t)){
    const nm = nextMatch();
    if(!nm) return "Nu există meciuri programate în modulul Match Operations.";
    return `Următorul meci: ${nm.adversar}, ${fmtDate(nm.data)} (${nm.competitie}, ${nm.acasa?'acasă':'deplasare'}). Sarcini operaționale:\n` + nm.sarcini.map(s=>`• ${s.titlu} — ${s.responsabil} (${taskStatusLabelSafe(s.status)}, termen ${fmtDate(s.deadline)})`).join('\n');
  }
  if(/loc\s*4|impact.*financiar|clasament/.test(t)){
    const sc = SCENARII_FINANCIARE.loc4;
    return `Impact financiar estimat — ${sc.label}: ${ron(sc.impactRon)} (venituri suplimentare estimate, sume variabile/condiționate). ${sc.nota}\nCompară scenarii complete în modulul Finanțe & Buget → Cash-flow & Forecast.`;
  }
  if(/board|raport.*conducer|raport.*luni|executive brief|pregăt.*raport/.test(t)){
    return "Iată sinteza pentru Board Meeting (Executive Brief):\n\n" + generateExecutiveBrief();
  }
  return "Momentan răspund pe bază de reguli fixe (nu sunt un model AI conversațional conectat live) la câteva tipuri de întrebări despre datele clubului deja introduse. Încearcă una dintre întrebările-exemplu de mai sus, sau formulează o întrebare despre: plăți/transferuri viitoare, contracte care expiră, obligațiile pentru următorul meci, impact financiar pe clasament, sau raportul pentru Board.";
}

function exportPersonalPDF(){
  const monthInput = document.getElementById('statMonth');
  const monthVal = (monthInput && monthInput.value) || currentMonthKey();
  if(!window.jspdf){ alert('Biblioteca de export PDF nu s-a încărcat (verifică conexiunea la internet) — încearcă din nou.'); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const [y,m] = monthVal.split('-');
  const lunaText = new Date(y, m-1, 1).toLocaleDateString('ro-RO', {month:'long', year:'numeric'});

  doc.setFontSize(14);
  doc.text(`Stat de personal — ${STATE.clubName}`, 14, 16);
  doc.setFontSize(10);
  doc.setTextColor(100);
  doc.text(`Perioada: ${lunaText}`, 14, 23);
  doc.setTextColor(20);

  let cursorY = 32;
  CATEGORII_ANGAJATI.forEach(cat=>{
    const list = STATE.angajati.filter(a=>a.categorie===cat);
    if(!list.length) return;
    doc.setFontSize(11);
    doc.text(cat, 14, cursorY);
    const body = list.map(a=>{
      const total = angajatTotal(a);
      const cur = a.moneda || 'LEI';
      return [a.nume, a.functie||'—', cur, money(a.salariuNet,cur), money(a.taxe,cur), money(a.chirie,cur), money(a.bonusuri,cur), money(total,cur)];
    });
    const subtotals = sumByCurrency(list);
    const footRows = Object.entries(subtotals).map(([cur,val])=>['','','','','','','Subtotal ('+cur+')', money(val,cur)]);
    doc.autoTable({
      startY: cursorY + 4,
      head: [['Nume','Funcție','Monedă','Salariu net','Taxe','Chirie','Bonusuri','Total']],
      body: body,
      foot: footRows,
      styles:{ fontSize:8, cellPadding:3 },
      headStyles:{ fillColor:[18,59,39] },
      footStyles:{ fillColor:[243,228,196], textColor:[20,20,20], fontStyle:'bold' },
      margin:{left:14, right:14}
    });
    cursorY = doc.lastAutoTable.finalY + 12;
  });

  const grandTotals = sumByCurrency(STATE.angajati);
  doc.setFontSize(12);
  doc.setFont(undefined, 'bold');
  const totalLine = Object.entries(grandTotals).map(([cur,val])=>money(val,cur)).join('   +   ');
  doc.text(`TOTAL GENERAL: ${totalLine}`, 14, cursorY);
  doc.setFont(undefined, 'normal');
  doc.save(`stat-personal-${monthVal}.pdf`);

function attachLoginHandlers(){
  const form = document.getElementById('loginForm');

  form.addEventListener('submit', (e)=>{

    const email = form.querySelector('[name="email"]').value.trim();
    const password = form.querySelector('[name="password"]').value;
    if(!email || !password) return;
    loginWithPassword(email, password);
  });
}

function normName(s){ return (s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z\s]/g,'').trim(); }
function playerAgentItems(nume){
  const key = normName(nume).split(' ').pop();
  const comisioane = STATE.comisioane.filter(c=>normName(c.jucator).includes(key));
  const prime = STATE.primeInstalare.filter(p=>normName(p.jucator).includes(key));
  const restComisioane = comisioane.filter(c=>!c.variabil).reduce((s,c)=>s+Number(c.suma||0)-Number(c.sumaAchitata||0),0);
  const restPrime = prime.reduce((s,p)=>s+Number(p.suma||0)-Number(p.sumaAchitata||0),0);
  const sellOn = comisioane.filter(c=>c.variabil);
  return { comisioane, prime, restComisioane, restPrime, sellOn };
}

/* ============ MODUL 4 — CONTRACTE & LEGAL ============ */
function renderContracts(){
  const q = STATE.contractSearchQuery || '';
  let rows = buildContracteRegistry();
  if(q.trim()){
    const nq = q.toLowerCase();
    rows = rows.filter(r=> (r.tip+' '+r.parte+' '+r.eveniment+' '+r.detalii).toLowerCase().includes(nq));
  }
  rows.sort((a,b)=>(a.data||'9999').localeCompare(b.data||'9999'));
  const alertRows = contracteExpirandIn(30).filter(r=>r.data).sort((a,b)=>a.data.localeCompare(b.data));
  const exp30 = alertRows.length;
  const exp90 = contracteExpirandIn(90).length;
  return `
    <h1 class="page-title">Contracte & Legal</h1>
    <p class="page-sub">Registru unificat: contracte jucători/staff, comisioane agenți, prime de instalare, sponsorizări, obligații de compliance. Căutare în limbaj liber (potrivire pe cuvinte cheie).</p>
    <div class="grid-summary">
      <div class="card kpi-mini"><span class="l">Evenimente în 30 zile</span><span class="n" style="color:var(--danger)">${exp30}</span></div>
      <div class="card kpi-mini"><span class="l">Evenimente în 90 zile</span><span class="n" style="color:var(--warn)">${exp90}</span></div>
      <div class="card kpi-mini"><span class="l">Total intrări în registru</span><span class="n">${buildContracteRegistry().length}</span></div>
    </div>

    ${alertRows.length ? `
    <div class="card" style="margin-bottom:20px;">
      <h3>Deadline-uri apropiate</h3>
      ${alertRows.map(r=>{
        const d = daysUntil(r.data);
        const sev = d!==null && d<=7 ? 'red' : 'orange';
        return `<div class="alert-card ${sev}">
          <div class="at">${(r.eveniment||'').toUpperCase()} — ${fmtDate(r.data)}</div>
          <div class="as">${r.parte}</div>
          <div class="as">${r.detalii||''}</div>
          <div class="as">⚠ ${d!==null?d:'—'} zile rămase</div>
        </div>`;
      }).join("")}
    </div>` : ''}

    <div class="card">
      <h3>Registru contracte
        <input id="contractSearch" placeholder="ex: sell-on, licență, Mr.Bit, comision..." value="${q.replace(/"/g,'&quot;')}" style="max-width:280px;">
      </h3>
      ${rows.length ? `
      <table>
        <thead><tr><th>Tip</th><th>Parte</th><th>Eveniment</th><th>Dată</th><th>Detalii</th></tr></thead>
        <tbody>${rows.map(r=>`
          <tr>
            <td><span class="badge-sport">${r.tip}</span></td>
            <td>${r.parte}</td>
            <td>${r.eveniment}</td>
            <td>${r.data ? fmtDate(r.data) : '—'}</td>
            <td style="font-size:11.5px; color:var(--muted); max-width:320px;">${r.detalii}</td>
          </tr>`).join("")}
        </tbody>
      </table>` : `<div class="empty">Niciun rezultat pentru „${q}”.</div>`}
      <div class="note">Registrul e compilat automat din datele deja introduse în Finanțe, Comercial și Compliance — nu e (încă) o bază de contracte cu extragere AI automată a clauzelor din PDF-uri (asta ar necesita procesare live cu un model AI conectat, discutat separat pentru etapa de hosting). Ca soluție practică deja disponibilă: încarcă un contract PDF direct într-o conversație cu Claude — poate extrage părțile, durata, salariul, bonusurile, opțiunile, sell-on-ul, ratele și clauzele speciale la momentul redactării, și îți poate genera rândurile de introdus aici.</div>
    </div>
  `;
}

function matchReadiness(m){
  const total = m.sarcini.length;
  const done = m.sarcini.filter(s=>s.status==='done').length;
  const critical = m.sarcini.filter(s=>s.status!=='done' && daysUntil(s.deadline)!==null && daysUntil(s.deadline)<0).length;
  const pending = total - done - critical;
  const pct = total ? Math.round(done/total*100) : 0;
  return { total, done, critical, pending, pct };
}

/* ============ MODUL — MEDICAL & PERFORMANCE (acces restricționat) ============ */
function playerAvailabilityStatus(nume){
  const key = normName(nume).split(' ').pop();
  const inj = STATE.injuries.filter(i=>normName(i.nume).includes(key));
  if(!inj.length) return {status:'available', label:'Available'};
  const modified = inj.some(i=>/suspend|ușoar|usoara|minor/i.test(i.tip||''));
  return { status: modified?'modified':'unavailable', label: modified?'Modified':'Unavailable', inj };
}
function renderMedical(){
  const seniori = STATE.angajati.filter(a=>a.categorie==='Jucători seniori').sort((a,b)=>a.nume.localeCompare(b.nume));
  const fullAccess = canSeeMedicalDetail();
  const rows = seniori.map(a=>({ a, av: playerAvailabilityStatus(a.nume) }));
  const counts = { available: rows.filter(r=>r.av.status==='available').length, modified: rows.filter(r=>r.av.status==='modified').length, unavailable: rows.filter(r=>r.av.status==='unavailable').length };
  return `

    <p class="page-sub">Acces restricționat prin permisiuni: doar Available / Modified / Unavailable e vizibil larg — detaliile clinice (tip accidentare, tratament, note medicale) sunt vizibile exclusiv pentru Administrator și Antrenor.</p>

      <div class="card kpi-mini"><span class="l">🔴 Unavailable</span><span class="n" style="color:var(--danger)">${counts.unavailable}</span></div>
    </div>

function buildDocumentsRegistry(){
  const rows = [];
  STATE.angajati.filter(a=>['Jucători seniori','Jucători juniori'].includes(a.categorie)).forEach(a=>{
    rows.push({ lant: `Player → ${a.nume} → Contract`, doc:'Contract de muncă sportivă', status: a.dataAngajare ? 'prezent' : 'lipsă', nota: a.dataAngajare ? 'Dată angajare înregistrată — documentul semnat nu e (încă) încărcat în aplicație.' : 'Fără dată de angajare înregistrată.' });
  });
  STATE.transferDeals.forEach(t=>{
    rows.push({ lant: `Player → ${t.nume} → Transfer`, doc:'Documente transfer (ITC, contract cedent)', status: t.documente ? 'prezent' : 'lipsă', nota: t.stage==='REGISTERED' ? 'Transfer înregistrat la FRF.' : `Etapă curentă: ${t.stage}.` });
  });
  STATE.matches.forEach(m=>{
    rows.push({ lant: `Match → ${m.adversar} (${fmtDate(m.data)}) → UEFA/FRF`, doc:'Foaie de arbitraj / delegat UEFA-FRF', status: m.sarcini.some(s=>/delegat|UEFA|FRF/i.test(s.titlu) && s.status==='done') ? 'prezent' : 'lipsă', nota:'Derivat din sarcinile de Match Center.' });
  });
  STATE.complianceItems.forEach(c=>{
    rows.push({ lant: `Compliance → ${c.categorie} → ${c.titlu}`, doc:'Document justificativ licențiere', status: (c.documente && c.documente.length) ? 'prezent' : (c.status==='complete' ? 'prezent' : 'lipsă'), nota: c.observatii || '' });
  });
  return rows;
}

  return `

      <div class="card kpi-mini"><span class="l">Prime jucători — rest de plată</span><span class="n" style="color:var(--danger)">${money(restPrime,'EUR')}</span></div>

        <tbody>${rowsC.map(c=>`
          <tr title="${(c.observatii||'').replace(/"/g,'&quot;')}">

function renderSponsorDetail(sponsorName){

    </div>

function drawCharts(){
  if(STATE.currentView !== "rapoarte") return;
  const months = [];
  const now = new Date();
  for(let i=5;i>=0;i--){ const d = new Date(now.getFullYear(), now.getMonth()-i, 1); months.push(d.toISOString().slice(0,7)); }
  const venituriM = months.map(k => STATE.transactions.filter(t=>t.type==='venit' && t.date.slice(0,7)===k).reduce((s,t)=>s+Number(t.amount),0));
  const cheltuieliM = months.map(k => STATE.transactions.filter(t=>t.type==='cheltuiala' && t.date.slice(0,7)===k).reduce((s,t)=>s+Number(t.amount),0));
  const labels = months.map(k=>{ const [y,m]=k.split('-'); return new Date(y,m-1,1).toLocaleDateString('ro-RO',{month:'short',year:'2-digit'}); });

  const ctx1 = document.getElementById('chartMonthly');
  if(ctx1){
    new Chart(ctx1, { type:'bar', data:{ labels, datasets:[
      {label:'Venituri', data:venituriM, backgroundColor:'#2F7D5A', borderRadius:4},
      {label:'Cheltuieli', data:cheltuieliM, backgroundColor:'#B23A34', borderRadius:4},
    ]}, options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{ position:'bottom', labels:{ boxWidth:10, font:{size:11} } } }, scales:{ y:{ ticks:{ font:{size:10} } }, x:{ ticks:{ font:{size:10} } } } } });
  }
  const catTotals = {};
  STATE.transactions.filter(t=>t.type==='cheltuiala').forEach(t=>{ catTotals[t.category] = (catTotals[t.category]||0) + Number(t.amount); });
  const catLabels = Object.keys(catTotals);
  const catData = Object.values(catTotals);
  const catPalette = {"Seniori":"#123B27","Academie":"#1E5C3B","Administrativ":"#C99A3E"};
  const ctx2 = document.getElementById('chartCategories');
  if(ctx2 && catLabels.length){
    new Chart(ctx2, { type:'doughnut', data:{ labels:catLabels, datasets:[{ data:catData, backgroundColor:catLabels.map(l=>catPalette[l]||'#647069') }] }, options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{ position:'bottom', labels:{ boxWidth:10, font:{size:10.5} } } } } });
  }
  const subcatBox = document.getElementById('subcatTable');
  if(subcatBox){
    const subMap = {};
    STATE.transactions.filter(t=>t.type==='cheltuiala').forEach(t=>{
      const key = `${t.category} › ${t.subcategorie||'—'}`;
      subMap[key] = (subMap[key]||0) + Number(t.amount);
    });
    const entries = Object.entries(subMap).sort((a,b)=>b[1]-a[1]);
    subcatBox.innerHTML = entries.length ? `
      <table><thead><tr><th>Categorie › Subcategorie</th><th style="text-align:right">Sumă</th></tr></thead>
      <tbody>${entries.map(([k,v])=>`<tr><td>${k}</td><td class="num">${ron(v)}</td></tr>`).join("")}</tbody></table>
    ` : '';
  }
  const platite = STATE.invoices.filter(i=>i.status==='platit').length;
  const neplatite = STATE.invoices.filter(i=>i.status!=='platit').length;
  const ctx3 = document.getElementById('chartCollection');
  if(ctx3 && (platite+neplatite)>0){
    new Chart(ctx3, { type:'doughnut', data:{ labels:['Plătite','Restante'], datasets:[{ data:[platite,neplatite], backgroundColor:['#2F7D5A','#B23A34'] }] }, options:{ responsive:true, maintainAspectRatio:false, cutout:'65%', plugins:{ legend:{ position:'bottom', labels:{ boxWidth:10, font:{size:11} } } } } });
  }
}

/* ============ EVENT WIRING ============ */
function attachHandlers(){
  document.querySelectorAll('[data-nav]').forEach(el=> el.addEventListener('click', ()=> navigate(el.getAttribute('data-nav'))));
  document.querySelectorAll('[data-open-modal]').forEach(el=> el.addEventListener('click', ()=> openModal(el.getAttribute('data-open-modal'), {})));
  document.querySelectorAll('[data-generate-brief]').forEach(el=> el.addEventListener('click', generateBriefAction));
  document.querySelectorAll('[data-logout]').forEach(el=> el.addEventListener('click', logout));

  document.querySelectorAll('[data-edit-transaction]').forEach(el=> el.addEventListener('click', ()=>{ const t = STATE.transactions.find(x=>x.id===el.getAttribute('data-edit-transaction')); openModal('transaction', t); }));
  document.querySelectorAll('[data-del-transaction]').forEach(el=> el.addEventListener('click', ()=> deleteTransaction(el.getAttribute('data-del-transaction'))));

  document.querySelectorAll('[data-pay-invoice]').forEach(el=> el.addEventListener('click', ()=> markInvoicePaid(el.getAttribute('data-pay-invoice'))));
  document.querySelectorAll('[data-del-invoice]').forEach(el=> el.addEventListener('click', ()=> deleteInvoice(el.getAttribute('data-del-invoice'))));

  document.querySelectorAll('[data-approve-referat]').forEach(el=> el.addEventListener('click', ()=> approveReferat(el.getAttribute('data-approve-referat'))));
  document.querySelectorAll('[data-reject-referat]').forEach(el=> el.addEventListener('click', ()=> rejectReferat(el.getAttribute('data-reject-referat'))));
  document.querySelectorAll('[data-del-referat]').forEach(el=> el.addEventListener('click', ()=> deleteReferat(el.getAttribute('data-del-referat'))));

  document.querySelectorAll('[data-pay-comision]').forEach(el=> el.addEventListener('click', ()=> markInstallmentPaid('comisioane', el.getAttribute('data-pay-comision'))));
  document.querySelectorAll('[data-pay-prima]').forEach(el=> el.addEventListener('click', ()=> markInstallmentPaid('primeInstalare', el.getAttribute('data-pay-prima'))));
  const filtruComisioane = document.getElementById('filtruComisioane');
  if(filtruComisioane) filtruComisioane.addEventListener('change', ()=>{ STATE.filtruComisioane = filtruComisioane.value; render(); });
  const filtruPrime = document.getElementById('filtruPrime');
  if(filtruPrime) filtruPrime.addEventListener('change', ()=>{ STATE.filtruPrime = filtruPrime.value; render(); });

  document.querySelectorAll('[data-pay-sponsor]').forEach(el=> el.addEventListener('click', ()=> markInstallmentPaid('scadentarSponsori', el.getAttribute('data-pay-sponsor'))));
  const filtruSponsori = document.getElementById('filtruSponsori');
  if(filtruSponsori) filtruSponsori.addEventListener('change', ()=>{ STATE.filtruSponsori = filtruSponsori.value; render(); });

  const aplicaTaxeBtn = document.getElementById('aplicaTaxeBtn');
  if(aplicaTaxeBtn) aplicaTaxeBtn.addEventListener('click', ()=>{
    const cat = document.getElementById('taxeCategorie').value;
    const proc = document.getElementById('taxeProcent').value;
    if(!proc){ alert('Introdu un procent.'); return; }
    applicaTaxeAngajator(cat, proc);
  });

  const salveazaCursBtn = document.getElementById('salveazaCursBtn');
  if(salveazaCursBtn) salveazaCursBtn.addEventListener('click', ()=>{
    const val = document.getElementById('cursInput').value;
    setCursEurRon(val);
  });

  document.querySelectorAll('[data-edit-angajat]').forEach(el=> el.addEventListener('click', ()=>{ const a = STATE.angajati.find(x=>x.id===el.getAttribute('data-edit-angajat')); openModal('angajat', a); }));
  document.querySelectorAll('[data-del-angajat]').forEach(el=> el.addEventListener('click', ()=> deleteAngajat(el.getAttribute('data-del-angajat'))));
  const exportBtn = document.getElementById('exportPdfBtn');
  if(exportBtn) exportBtn.addEventListener('click', exportPersonalPDF);

  document.querySelectorAll('[data-close-modal]').forEach(el=> el.addEventListener('click', closeModal));
  document.querySelectorAll('[data-close-backdrop]').forEach(el=> el.addEventListener('click', (e)=>{ if(e.target === el) closeModal(); }));
  document.querySelectorAll('[data-stop]').forEach(el=> el.addEventListener('click', (e)=> e.stopPropagation()));

  const txForm = document.getElementById('transactionForm');
  if(txForm){
    txForm.addEventListener('submit', (e)=>{ e.preventDefault(); saveTransaction(e.target); });
    const typeSel = document.getElementById('txType');
    typeSel.addEventListener('change', ()=>{ captureTxForm(STATE.modal.data, txForm); STATE.modal.data.type = typeSel.value; STATE.modal.data.category = null; render(); });
    const catSel = document.getElementById('txCategory');
    catSel.addEventListener('change', ()=>{ captureTxForm(STATE.modal.data, txForm); STATE.modal.data.category = catSel.value; STATE.modal.data.subcategorie = null; render(); });
  }

  const invForm = document.getElementById('invoiceForm');
  if(invForm) invForm.addEventListener('submit', (e)=>{ e.preventDefault(); saveInvoice(e.target); });

  const refForm = document.getElementById('referatForm');
  if(refForm){
    refForm.addEventListener('submit', (e)=>{ e.preventDefault(); saveReferat(e.target); });
    const refCatSel = document.getElementById('refCategory');
    refCatSel.addEventListener('change', ()=>{ captureRefForm(STATE.modal.data, refForm); STATE.modal.data.category = refCatSel.value; STATE.modal.data.subcategorie = null; render(); });
  }

  const angForm = document.getElementById('angajatForm');
  if(angForm) angForm.addEventListener('submit', (e)=>{ e.preventDefault(); saveAngajat(e.target); });

  if(STATE.currentView === "finance" && STATE.currentFinanceTab === "rapoarte"){ setTimeout(drawCharts, 0); }

  /* ---- MODULE NOI: taburi, kanban, compliance, match ops, task-uri, simulator, asistent AI ---- */
  document.querySelectorAll('[data-toggle-audit-all]').forEach(el=> el.addEventListener('click', ()=>{ STATE.auditShowAll = !STATE.auditShowAll; render(); }));
  document.querySelectorAll('[data-toggle-alerts-all]').forEach(el=> el.addEventListener('click', ()=>{ STATE.alertsShowAll = !STATE.alertsShowAll; render(); }));
  document.querySelectorAll('[data-finance-tab]').forEach(el=> el.addEventListener('click', ()=>{ STATE.currentFinanceTab = el.getAttribute('data-finance-tab'); render(); }));
  document.querySelectorAll('[data-commercial-tab]').forEach(el=> el.addEventListener('click', ()=>{ STATE.currentCommercialTab = el.getAttribute('data-commercial-tab'); render(); }));

  const saveStandingBtn = document.querySelector('[data-save-standing]');
  if(saveStandingBtn){
    saveStandingBtn.addEventListener('click', ()=>{
      const pEl = document.getElementById('csPozitie'), ptEl = document.getElementById('csPuncte');
      STATE.clubStanding.pozitie = pEl.value ? Number(pEl.value) : null;
      STATE.clubStanding.puncte = ptEl.value ? Number(ptEl.value) : null;
      STATE.clubStanding.lastUpdate = todayISO();
      saveClubStanding();
    });
  }
  const injuryForm = document.querySelector('[data-injury-form]');
  if(injuryForm){
    injuryForm.addEventListener('submit', (e)=>{
      e.preventDefault();
      const fd = new FormData(injuryForm);
      addInjury(fd.get('nume'), fd.get('tip'), fd.get('revenire'), '');
    });
  }
  document.querySelectorAll('[data-remove-injury]').forEach(el=> el.addEventListener('click', (e)=>{ e.preventDefault(); removeInjury(el.getAttribute('data-remove-injury')); }));
  document.querySelectorAll('[data-alert-open-contract]').forEach(el=> el.addEventListener('click', ()=> openContractFor(el.getAttribute('data-alert-open-contract'))));
  document.querySelectorAll('[data-alert-open-payment]').forEach(el=> el.addEventListener('click', ()=> openPaymentModule()));
  document.querySelectorAll('[data-alert-assign-task]').forEach(el=> el.addEventListener('click', ()=>{
    const [jucator, contractLabel, suma, moneda, data] = el.getAttribute('data-alert-assign-task').split('|');
    assignTaskFromAlert(jucator, contractLabel, suma, moneda, data);
  }));

  document.querySelectorAll('[data-open-sponsor]').forEach(el=> el.addEventListener('click', ()=>{ STATE.selectedSponsorName = el.getAttribute('data-open-sponsor'); render(); }));
  const backSponsorsBtn = document.querySelector('[data-back-sponsors]');
  if(backSponsorsBtn) backSponsorsBtn.addEventListener('click', ()=>{ STATE.selectedSponsorName = null; render(); });

  document.querySelectorAll('[data-open-player]').forEach(el=> el.addEventListener('click', ()=>{ STATE.selectedPlayerId = el.getAttribute('data-open-player'); STATE.playerDetailTab = 'profile'; render(); }));
  const backPlayersBtn = document.querySelector('[data-back-players]');
  if(backPlayersBtn) backPlayersBtn.addEventListener('click', ()=>{ STATE.selectedPlayerId = null; render(); });
  document.querySelectorAll('[data-player-detail-tab]').forEach(el=> el.addEventListener('click', ()=>{ STATE.playerDetailTab = el.getAttribute('data-player-detail-tab'); render(); }));
  document.querySelectorAll('[data-player-form]').forEach(el=> el.addEventListener('submit', (e)=>{
    e.preventDefault();
    const playerId = el.getAttribute('data-player-form');
    const fd = new FormData(el);
    const fields = {};
    fd.forEach((v,k)=> fields[k]=v);
    savePlayerTab(playerId, fields);
  }));

  document.querySelectorAll('[data-deal-stage]').forEach(el=> el.addEventListener('change', ()=> setDealStage(el.getAttribute('data-deal-stage'), el.value)));

  const sbTipEl = document.getElementById('sbTip');
  if(sbTipEl) sbTipEl.addEventListener('change', ()=>{ STATE.scenarioBuilder.tip = sbTipEl.value; STATE.scenarioBuilderResult = null; render(); });
  const runScenarioBtn = document.querySelector('[data-run-scenario]');
  if(runScenarioBtn){
    runScenarioBtn.addEventListener('click', ()=>{
      const jEl = document.getElementById('sbJucator'), sEl = document.getElementById('sbSuma'), dEl = document.getElementById('sbData');
      if(jEl) STATE.scenarioBuilder.jucatorId = jEl.value;
      if(sEl) STATE.scenarioBuilder.suma = Number(sEl.value)||0;
      if(dEl) STATE.scenarioBuilder.data = dEl.value;
      calculateScenario();
    });
  }

  const dcCalcBtn = document.querySelector('[data-calc-deal]');
  if(dcCalcBtn){
    dcCalcBtn.addEventListener('click', ()=>{
      STATE.dealCalc.feeTransfer = Number(document.getElementById('dcFee').value)||0;
      STATE.dealCalc.salariuLunar = Number(document.getElementById('dcSalariu').value)||0;
      STATE.dealCalc.signingFee = Number(document.getElementById('dcSigning').value)||0;
      STATE.dealCalc.comisionAgent = Number(document.getElementById('dcComision').value)||0;
      STATE.dealCalc.aniContract = Number(document.getElementById('dcAni').value)||1;
      calculateDeal();
    });
  }
  document.querySelectorAll('[data-compliance-status]').forEach(el=> el.addEventListener('change', ()=> setComplianceStatus(el.getAttribute('data-compliance-status'), el.value)));
  document.querySelectorAll('[data-task-status]').forEach(el=> el.addEventListener('change', ()=> setTask(el.getAttribute('data-task-status'), 'status', el.value)));
  document.querySelectorAll('[data-match-task]').forEach(el=> el.addEventListener('change', ()=>{
    const [matchId, idx] = el.getAttribute('data-match-task').split('|');
    setMatchTaskStatus(matchId, Number(idx), el.value);
  }));

  const askUForm = document.getElementById('askUForm');
  if(askUForm){
    askUForm.addEventListener('submit', (e)=>{
      e.preventDefault();
      const input = document.getElementById('askUInput');
      if(!input.value.trim()) return;
      sendChatMessage(input.value);
      STATE.currentView = 'assistant';
      render();
    });
  }

  const toggleNotifBtn = document.querySelector('[data-toggle-notifications]');
  if(toggleNotifBtn) toggleNotifBtn.addEventListener('click', ()=> toggleNotifications());
  const markAllReadBtn = document.querySelector('[data-mark-all-read]');
  if(markAllReadBtn) markAllReadBtn.addEventListener('click', (e)=>{ e.stopPropagation(); markAllNotificationsRead(); });
  document.querySelectorAll('[data-notif-goto]').forEach(el=> el.addEventListener('click', (e)=>{
    e.preventDefault();
    const [view, id] = el.getAttribute('data-notif-goto').split('|');
    markNotificationRead(id);
    STATE.currentView = view;
    STATE.showNotifications = false;
    render();
  }));

  const intakeTipEl = document.getElementById('intakeTip');
  if(intakeTipEl){
    intakeTipEl.addEventListener('change', ()=>{
      const textEl = document.getElementById('intakeText');
      if(textEl) STATE.intakeDraft.text = textEl.value;
      STATE.intakeDraft.tip = intakeTipEl.value;
      STATE.intakeResult = null;
      render();
    });
  }
  const processIntakeBtn = document.querySelector('[data-process-intake]');
  if(processIntakeBtn){
    processIntakeBtn.addEventListener('click', ()=>{
      const textEl = document.getElementById('intakeText');
      STATE.intakeDraft.text = textEl ? textEl.value : '';
      processIntake();
    });
  }

  const contractSearch = document.getElementById('contractSearch');
  if(contractSearch) contractSearch.addEventListener('input', ()=>{ STATE.contractSearchQuery = contractSearch.value; render(); });
  const docSearch = document.getElementById('docSearch');
  if(docSearch) docSearch.addEventListener('input', ()=>{ STATE.docSearchQuery = docSearch.value; render(); });

  const scenarioSelect = document.getElementById('scenarioSelect');
  if(scenarioSelect) scenarioSelect.addEventListener('change', ()=> applyForecastScenario(scenarioSelect.value));

  const sagaContInput = document.getElementById('sagaContInput');
  if(sagaContInput) sagaContInput.addEventListener('input', ()=> setSagaCont(sagaContInput.value));
  document.querySelectorAll('[data-export-saga]').forEach(el=> el.addEventListener('click', ()=> exportSagaFile(el.getAttribute('data-export-saga'))));

  const runSimBtn = document.querySelector('[data-run-sim]');
  if(runSimBtn) runSimBtn.addEventListener('click', ()=>{
    const jucatorPlecatId = document.getElementById('simPlecat').value;
    const transferFee = parseFloat(document.getElementById('simFee').value)||0;
    const salariuNou = parseFloat(document.getElementById('simSalariuNou').value)||0;
    STATE.simTransfer = { jucatorPlecatId, transferFee, salariuNou };
    STATE.simTransferResult = simulareTransfer(jucatorPlecatId, transferFee, salariuNou, 'EUR');
    scheduleSave();
    render();
  });

  const chatForm = document.getElementById('chatForm');
  if(chatForm) chatForm.addEventListener('submit', (e)=>{
    e.preventDefault();
    const input = document.getElementById('chatInput');
    sendChatMessage(input.value);
    input.value = '';
  });
  document.querySelectorAll('[data-chat-suggestion]').forEach(el=> el.addEventListener('click', ()=> sendChatMessage(el.getAttribute('data-chat-suggestion'))));
}

/* ============ INIT ============ */
async function init(){
  render();
  await loadAccount();
  if(STATE.currentAccount) await loadState();
  render();
  if(sb){
    sb.auth.onAuthStateChange((event)=>{
      if(event === 'SIGNED_OUT'){
        STATE.currentAccount = null;
        STATE.clubLoaded = false;
        render();
      }
    });
  }
}
init();
</script>
</body>
</html>
